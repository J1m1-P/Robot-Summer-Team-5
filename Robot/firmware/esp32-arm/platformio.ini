; PlatformIO Project Configuration File
;
; Two environments share src/, differing only by which main*.cpp each
; build_src_filter admits.
;
;   pio run -e esp32-s3-devkitm-1 -t upload   # production: streams framed odometry packets
;   pio run -e optical_debug -t upload        # full-burst diagnostics harness
;   pio run -e calibration -t upload          # machine-readable calibration stream
;   pio run -e arm_jog -t upload              # USB servo/stepper jog harness
;   pio device monitor -e <env>

[env]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    ; Keep this exact version: 3.2.1's ESP32-S3 MCPWM routing aliases
    ; servos by A/B output group. 3.0.5 assigns one LEDC channel per servo.
    madhephaestus/ESP32Servo @ 3.0.5

[env:esp32-s3-devkitm-1]
build_src_filter =
    +<*>
    -<debug_main.cpp>
    -<calibration_main.cpp>
    -<harnesses/>

[env:optical_debug]
build_src_filter =
    +<*>
    -<main.cpp>
    -<calibration_main.cpp>
    -<harnesses/>

[env:calibration]
build_src_filter =
    +<*>
    -<main.cpp>
    -<debug_main.cpp>
    -<harnesses/>

[env:tof-test]
; Temporary XSHUT wiring uses GPIO45/46, leaving UART0 GPIO43/44 available for
; the CH340 test interface. Production environments still use native USB CDC.
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DTOF_ENABLE_TEST_DIAGNOSTICS=1
build_src_filter =
    -<*>
    +<harnesses/tof_test_main.cpp>
    +<drivers/time_of_flight/vl53l0x_driver.c>
    +<config/tof_config.c>
    +<config/i2c_bus_config.c>
; Interactive USB arm hardware jog harness. Open tools/arm_jog_dashboard.html
; after uploading this environment.
[env:arm_jog]
lib_deps =
    ; Seven independent LEDC outputs; do not upgrade to the aliased 3.2.1 backend.
    madhephaestus/ESP32Servo @ 3.0.5
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<harnesses/arm_jog_main.cpp>
    +<drivers/servo_driver.cpp>
    +<drivers/stepper_driver.cpp>

[env:task-link-test]
; The boards expose UART0 through a CH340K. Keep Serial on UART0 so the
; browser's Web Serial connection receives the JSON test telemetry.
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<task_link_test_main.cpp>
    +<task/arm_manager.c>
    +<communication/task_server.c>
    +<config/task_link_config.c>
    +<config/uart_link_config.c>
