; PlatformIO Project Configuration File
;
; Two environments share src/, differing only by which main*.cpp each
; build_src_filter admits.
;
;   pio run -e esp32-s3-devkitm-1 -t upload   # production: streams framed odometry packets
;   pio run -e optical_debug -t upload        # full-burst diagnostics harness
;   pio run -e calibration -t upload          # machine-readable calibration stream
;   pio run -e arm_jog -t upload              # USB servo/stepper jog harness
;   pio device monitor -e <env>

[env]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    ; Keep this exact version: 3.2.1's ESP32-S3 MCPWM routing aliases
    ; servos by A/B output group. 3.0.5 assigns one LEDC channel per servo.
    madhephaestus/ESP32Servo @ 3.0.5

[env:esp32-s3-devkitm-1]
build_src_filter =
    +<*>
    -<debug_main.cpp>
    -<calibration_main.cpp>
    -<harnesses/>

[env:optical_debug]
build_src_filter =
    +<*>
    -<main.cpp>
    -<calibration_main.cpp>
    -<harnesses/>

[env:calibration]
build_src_filter =
    +<*>
    -<main.cpp>
    -<debug_main.cpp>
    -<harnesses/>

; Interactive USB arm hardware jog harness. Open tools/arm_jog_dashboard.html
; after uploading this environment.
[env:arm_jog]
lib_deps =
    ; Seven independent LEDC outputs; do not upgrade to the aliased 3.2.1 backend.
    madhephaestus/ESP32Servo @ 3.0.5
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<harnesses/arm_jog_main.cpp>
    +<drivers/servo_driver.cpp>
    +<drivers/stepper_driver.cpp>
