; SAFETY-CRITICAL: every environment below whose entry point drives a motor
; (directly via MotorDriver or through Drivetrain) must call
; drivetrain_hold_safe_outputs(&DRIVETRAIN_CONFIG) as the first statement in
; its setup(), before Serial.begin()/delay()/UART/sensor init. Motor GPIOs
; power up undefined; without this call first, the robot can drive
; uncommanded at full power. See the comment on drivetrain_hold_safe_outputs()
; in include/control/drivetrain/drivetrain.h. New envs/harnesses that touch a
; motor must not skip it. tof-test is the only exception because it never
; drives a motor GPIO.
[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; upload_port = COM8

; monitor_port = COM8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=5
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    ; The VL53L5CX ULD keeps its public API and platform port in nonstandard
    ; nested directories. Keep these explicit so both the compiler and the
    ; generated VS Code IntelliSense configuration resolve the public header.
    -Ilib/st-vl53l5cx-uld/src/core/inc
    -Ilib/st-vl53l5cx-uld/src/platform

; Production firmware uses src/main.cpp. Hardware tuning/debug harnesses
; have their own environments below and must not add extra setup()/loop().
build_src_filter =
    +<*>
    -<harnesses/>

; Host-compiled, no ESP32 hardware needed. Pure control and sensing modules
; are buildable here. Hardware implementation files touching Arduino or
; ESP-IDF peripherals are excluded; minimal public type dependencies use
; test/native_stubs.
[env:native]
platform = native
test_build_src = yes
test_ignore = test_robot_sequence, test_pose_service
lib_extra_dirs = ../lib
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_stubs
    -I../lib/robot-common/include
    -I../esp32-arm/include
build_src_filter =
    -<*>
    +<control/drivetrain/x_drive_kinematics.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/odometry.c>
    +<control/drivetrain/drivetrain_odometry_source.c>
    +<control/drivetrain/pmw3610_odometry_source.c>
    +<control/drivetrain/off_tape_motion.c>
    +<control/drivetrain/speed_profile.c>
    +<control/drivetrain/endpoint_settle.c>
    +<control/drivetrain/rotational_settle.c>
    +<control/drivetrain/move_s.c>
    +<control/drivetrain/move_l.c>
    +<control/drivetrain/motion_estimate_adapter.c>
    +<control/drivetrain/path_planner.c>
    +<control/drivetrain/move_p.c>
    +<control/drivetrain/move_r.c>
    +<control/drivetrain/move_c.c>
    +<control/drivetrain/rot_s.c>
    +<config/drivetrain/move_calibration_config.c>
    +<control/tape_following/tape_following_controller.c>
    +<control/tape_following/tape_alignment.c>
    +<control/tape_following/tape_follower.c>
    +<control/tape_following/tape_following_kinematics.c>
    +<sensing/tape_following/tape_line_estimator.c>
    +<sensing/tape_following/tape_locating_detection.c>
    +<sensing/tape_following/tape_task_detection.c>

; Host test for the production robot sequence with a fake arm UART.
[env:robot-sequence-native]
platform = native
test_build_src = yes
lib_ignore = robot-common
test_filter = test_robot_sequence
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_stubs
    -I../lib/robot-common/include
build_src_filter =
    -<*>
    +<control/task/robot_sequence_controller.c>
    +<control/task/movement_action_controller.c>

; Host test for pose_service's arm_uart drain/dispatch, with fakes for
; everything it hands frames off to.
[env:pose-service-native]
platform = native
test_build_src = yes
lib_ignore = robot-common
test_filter = test_pose_service
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_stubs
    -I../lib/robot-common/include
build_src_filter =
    -<*>
    +<control/odometry/pose_service.c>

; Single-wheel (FL) wheel_velocity_controller tuning harness -- real hardware,
; separate entry point so tuning instrumentation never touches main.cpp.
; See src/harnesses/tuning_main.cpp for the serial protocol.
[env:tuning]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<harnesses/tuning_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/x_drive_kinematics.c>
    +<control/drivetrain/speed_profile.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
    +<config/drivetrain/move_calibration_config.c>

; Full-robot closed-loop drive harness with serial/WebSocket telemetry.
; See src/harnesses/drive_main.cpp.
[env:drive]
lib_extra_dirs = ../lib
lib_deps = links2004/WebSockets @ ^2.4.1
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<harnesses/drive_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/drivetrain.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/x_drive_kinematics.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
    +<config/drivetrain/move_calibration_config.c>

