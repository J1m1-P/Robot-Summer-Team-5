[env:esp32-s3-devkitm-1]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

upload_port = COM5

monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE

; Host-compiled, no ESP32 hardware needed. Only pure-math control/config
; modules are buildable here -- anything touching Arduino.h or ESP-IDF
; drivers (driver/gpio.h, driver/pcnt.h, etc.) is excluded via
; build_src_filter below and stays untestable outside esp32-s3-devkitm-1.
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_stubs
build_src_filter =
    -<*>
    +<control/drivetrain_kinematics.c>
    +<control/drivetrain_velocity_kinematics.cpp>
    +<control/wheel_velocity_pi.cpp>

; Single-wheel (FL) wheel_velocity_pi tuning harness -- real hardware,
; separate entry point (tuning_main.cpp) so tuning instrumentation never
; touches main.cpp. See src/tuning_main.cpp for the serial protocol.
[env:tuning]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<tuning_main.cpp>
    +<drivers/motor_driver.c>
    +<drivers/encoder_driver.c>
    +<control/wheel_velocity_pi.cpp>
    +<config/motor_config.c>
    +<config/encoder_config.c>
    +<config/wheel_velocity_pi_config.cpp>

; Full-robot (all 4 wheels) drive test -- battery-powered motors, USB
; connected for serial control/telemetry only. First real use of
; control/drivetrain_velocity_kinematics.h against actual chassis motion --
; the wheel-sign conventions in that model have only been checked against
; the old duty mixer's signs (test_kinematics_parity) and hand math, never
; against a real robot actually moving. See src/drive_main.cpp.
[env:drive]
lib_extra_dirs = ../lib
lib_deps = links2004/WebSockets @ ^2.4.1
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<drive_main.cpp>
    +<drivers/motor_driver.c>
    +<drivers/encoder_driver.c>
    +<control/wheel_velocity_pi.cpp>
    +<control/drivetrain_velocity_kinematics.cpp>
    +<config/motor_config.c>
    +<config/encoder_config.c>
    +<config/wheel_velocity_pi_config.cpp>
    +<config/drivetrain_velocity_kinematics_config.cpp>
