[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
lib_extra_dirs = ../lib
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    ; The VL53L5CX ULD keeps its public API and platform port in nonstandard
    ; nested directories. Keep these explicit so both the compiler and the
    ; generated VS Code IntelliSense configuration resolve the public header.
    -Ilib/st-vl53l5cx-uld/src/core/inc
    -Ilib/st-vl53l5cx-uld/src/platform

; Production firmware uses src/main.cpp. Hardware tuning/debug harnesses
; have their own environments below and must not add extra setup()/loop().
build_src_filter =
    +<*>
    -<harnesses/>

; Host-compiled, no ESP32 hardware needed. Pure control and sensing modules
; are buildable here. Hardware implementation files touching Arduino or
; ESP-IDF peripherals are excluded; minimal public type dependencies use
; test/native_stubs.
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_stubs
    -I../lib/robot-common/include
    -I../esp32-arm/include
build_src_filter =
    -<*>
    +<control/drivetrain/x_drive_kinematics.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/odometry.c>
    +<control/drivetrain/drivetrain_odometry_source.c>
    +<control/drivetrain/off_tape_motion.c>
    +<control/drivetrain/speed_profile.c>
    +<control/drivetrain/endpoint_settle.c>
    +<control/drivetrain/move_s.c>
    +<control/drivetrain/move_l.c>
    +<control/drivetrain/motion_estimate_adapter.c>
    +<control/drivetrain/path_planner.c>
    +<control/drivetrain/move_p.c>
    +<control/drivetrain/move_r.c>
    +<control/drivetrain/move_c.c>
    +<control/drivetrain/rot_s.c>
    +<config/drivetrain/move_calibration_config.c>
    +<control/tape_following/tape_following_controller.c>
    +<control/tape_following/tape_follower.c>
    +<control/tape_following/tape_following_kinematics.c>
    +<sensing/tape_following/tape_line_estimator.c>
    +<sensing/tape_following/tape_task_detection.c>
    +<task/drivetrain_action_dispatcher.c>

; Single-wheel (FL) wheel_velocity_controller tuning harness -- real hardware,
; separate entry point so tuning instrumentation never touches main.cpp.
; See src/harnesses/tuning_main.cpp for the serial protocol.
[env:tuning]
lib_extra_dirs = ../lib
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<harnesses/tuning_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/x_drive_kinematics.c>
    +<control/drivetrain/speed_profile.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
    +<config/drivetrain/move_calibration_config.c>

; Full-robot closed-loop drive harness with serial/WebSocket telemetry.
; See src/harnesses/drive_main.cpp.
[env:drive]
lib_extra_dirs = ../lib
lib_deps = links2004/WebSockets @ 2.7.3
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<harnesses/drive_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/drivetrain.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/x_drive_kinematics.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
    +<config/drivetrain/move_calibration_config.c>

; MoveS/RotS calibration harness -- runs MoveS/RotS on real hardware through
; the production Drivetrain facade + drivetrain_odometry_source, feeding the
; calibration paper's F_lon/F_lat/F_ang procedure (docs/TUNING_ROADMAP.md
; §3/§5d). See src/harnesses/calibration_main.cpp.
[env:calibration]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<harnesses/calibration_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/drivetrain.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/x_drive_kinematics.c>
    +<control/drivetrain/speed_profile.c>
    +<control/drivetrain/odometry.c>
    +<control/drivetrain/drivetrain_odometry_source.c>
    +<control/drivetrain/motion_estimate_adapter.c>
    +<control/drivetrain/off_tape_motion.c>
    +<control/drivetrain/path_planner.c>
    +<control/drivetrain/endpoint_settle.c>
    +<control/drivetrain/move_c.c>
    +<control/drivetrain/move_p.c>
    +<control/drivetrain/move_r.c>
    +<control/drivetrain/move_s.c>
    +<control/drivetrain/move_l.c>
    +<control/drivetrain/rot_s.c>
    +<control/tape_following/tape_following_controller.c>
    +<config/drivetrain/move_calibration_config.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
    +<config/drivetrain/move_calibration_config.c>

; Interactive hardware acceptance test for each motor/encoder pair and the
; complete drivetrain. See src/harnesses/drivetrain_test_main.cpp.
[env:drivetrain-test]
lib_extra_dirs = ../lib
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_echo = no
monitor_eol = LF

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17

build_src_filter =
    -<*>
    +<harnesses/drivetrain_test_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/drivetrain.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/x_drive_kinematics.c>
    +<control/drivetrain/odometry.c>
    +<drivers/tape_sensor/tape_sensor_driver.c>
    +<sensing/tape_following/tape_line_estimator.c>
    +<control/tape_following/tape_following_controller.c>
    +<control/tape_following/tape_follower.c>
    +<control/tape_following/tape_following_kinematics.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
    +<config/drivetrain/move_calibration_config.c>
    +<config/tape_following/tape_following_config.c>

; ToF-only shared-bus address assignment and live ranging diagnostic.
[env:tof-test]
lib_extra_dirs = ../lib
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DTOF_ENABLE_TEST_DIAGNOSTICS=1
    -Ilib/st-vl53l5cx-uld/src/core/inc
    -Ilib/st-vl53l5cx-uld/src/platform
build_src_filter =
    -<*>
    +<harnesses/tof_test_main.cpp>
    +<drivers/time_of_flight/vl53l0x_driver.c>
    +<drivers/time_of_flight/vl53l5cx_driver.c>
    +<config/time_of_flight/tof_config.c>
    +<config/communication/i2c_bus_config.c>

; Coordinator + real UART1 protocol harness controlled by task_coordinator_dashboard.html.
[env:task-coordinator-test]
lib_extra_dirs = ../lib
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
build_src_filter =
    -<*>
    +<harnesses/task_coordinator_test_main.cpp>
    +<task/task_coordinator.c>
    +<config/communication/task_link_config.c>
    +<config/communication/uart_link_config.c>

; One-flash interactive image for the combined robot_system_test_dashboard.
; Runtime modes keep hardware ownership exclusive:
;   mode coordination | mode drivetrain | mode tof
[env:system-test]
lib_extra_dirs = ../lib
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_echo = no
monitor_eol = LF
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DSYSTEM_TEST_BUILD=1
    -DTOF_ENABLE_TEST_DIAGNOSTICS=1
    -Ilib/st-vl53l5cx-uld/src/core/inc
    -Ilib/st-vl53l5cx-uld/src/platform
build_src_filter =
    -<*>
    +<harnesses/system_test_main.cpp>
    +<harnesses/drivetrain_test_main.cpp>
    +<harnesses/tof_test_main.cpp>
    +<harnesses/task_coordinator_test_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<drivers/tape_sensor/tape_sensor_driver.c>
    +<drivers/time_of_flight/vl53l0x_driver.c>
    +<drivers/time_of_flight/vl53l5cx_driver.c>
    +<control/drivetrain/drivetrain.c>
    +<control/drivetrain/wheel_velocity_controller.c>
    +<control/drivetrain/x_drive_kinematics.c>
    +<control/tape_following/tape_following_controller.c>
    +<control/tape_following/tape_follower.c>
    +<control/tape_following/tape_following_kinematics.c>
    +<sensing/tape_following/tape_line_estimator.c>
    +<task/task_coordinator.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
    +<config/tape_following/tape_following_config.c>
    +<config/time_of_flight/tof_config.c>
    +<config/communication/i2c_bus_config.c>
    +<config/communication/task_link_config.c>
    +<config/communication/uart_link_config.c>
