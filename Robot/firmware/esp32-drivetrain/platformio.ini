; §3/§5d). See src/harnesses/calibration_main.cpp.
[env:calibration]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
