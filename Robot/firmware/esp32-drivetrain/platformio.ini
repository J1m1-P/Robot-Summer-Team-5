[env:esp32-s3-devkitm-1]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

upload_port = COM5

monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE

; Host-compiled, no ESP32 hardware needed. Only pure-math control/config
; modules are buildable here -- anything touching Arduino.h or ESP-IDF
; drivers (driver/gpio.h, driver/pcnt.h, etc.) is excluded via
; build_src_filter below and stays untestable outside esp32-s3-devkitm-1.
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_stubs
build_src_filter =
    -<*>
    +<control/drivetrain_kinematics.c>
    +<control/drivetrain_velocity_kinematics.cpp>
