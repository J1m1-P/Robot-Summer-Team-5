[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

upload_port = COM5

monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE

; Production firmware uses src/main.cpp. Hardware tuning/debug harnesses
; have their own environments below and must not add extra setup()/loop().
build_src_filter =
    +<*>
    -<harnesses/>

; Host-compiled, no ESP32 hardware needed. Only pure-math control/config
; modules are buildable here -- anything touching Arduino.h or ESP-IDF
; drivers (driver/gpio.h, driver/pcnt.h, etc.) is excluded via
; build_src_filter below and stays untestable outside esp32-s3-devkitm-1.
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_stubs
build_src_filter =
    -<*>
    +<control/drivetrain/velocity_kinematics.c>
    +<control/drivetrain/wheel_velocity_pi.c>
    +<control/drivetrain/odometry.c>

; Single-wheel (FL) wheel_velocity_pi tuning harness -- real hardware,
; separate entry point so tuning instrumentation never touches main.cpp.
; See src/harnesses/tuning_main.cpp for the serial protocol.
[env:tuning]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<harnesses/tuning_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/wheel_velocity_pi.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>

; Full-robot closed-loop drive harness with serial/WebSocket telemetry.
; See src/harnesses/drive_main.cpp.
[env:drive]
lib_extra_dirs = ../lib
lib_deps = links2004/WebSockets @ ^2.4.1
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    -<*>
    +<harnesses/drive_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/drivetrain.c>
    +<control/drivetrain/wheel_velocity_pi.c>
    +<control/drivetrain/velocity_kinematics.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>

; Interactive hardware acceptance test for each motor/encoder pair and the
; complete drivetrain. See src/harnesses/drivetrain_test_main.cpp.
[env:drivetrain-test]
lib_extra_dirs = ../lib
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_echo = no
monitor_eol = LF

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17

build_src_filter =
    -<*>
    +<harnesses/drivetrain_test_main.cpp>
    +<drivers/motor/motor_driver.c>
    +<drivers/encoder/encoder_driver.c>
    +<control/drivetrain/drivetrain.c>
    +<control/drivetrain/wheel_velocity_pi.c>
    +<control/drivetrain/velocity_kinematics.c>
    +<config/drivetrain/motor_config.c>
    +<config/drivetrain/encoder_config.c>
    +<config/drivetrain/drivetrain_config.c>
